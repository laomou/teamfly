[package]
name = "teamfly"
version = "0.2.0"
edition = "2021"

[dependencies]
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.1"

# 取消 agent 时按进程组杀(连它起的 cargo build 之类一起),需要 killpg
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 0
